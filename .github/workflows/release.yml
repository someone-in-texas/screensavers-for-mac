name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and toolchain
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Build and test
        run: |
          make build
          ./Scripts/test.sh
      - name: Import optional Developer ID identity
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./Scripts/import-signing.sh
      - name: Sign and package
        env:
          SKIP_BUILD: '1'
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          ./Scripts/package.sh
          ./Scripts/verify-package.sh
      - name: Publish verified assets
        run: |
          cat > build/release-notes.md <<'NOTES'
          Seven native screen savers that turn idle displays into imaginative, ever-changing worlds. For Apple Silicon Macs running macOS 14.6 or later.

          - **City Drift** — crisp online vector maps across 64 cities, with configurable map details and bundled offline alternatives.
          - **World Clock Room** — an isometric clock installation with real local times, smooth hands, and configurable colors.
          - **Voxel Cosmos** — a glowing pixel solar system with planet closeups, isometric viewpoints, and deep-space scenes.
          - **Paper Sky** — procedural paper-airplane flight above sculpted clouds and evolving synthwave sunsets.
          - **Dapple** — tactile circles rolling over invisible hills, with gentle contacts, curated palettes, and procedural materials.
          - **Flourish** — growing botanical ink, tapered branching stems, delicate leaves and blossoms, and slowly renewing compositions.
          - **Lattice** — a luminous cellular ecosystem with four rule families, crisp pixels, subtle glow, and localized events.

          This update adds Flourish and Lattice, each refined through five art-critic rounds. Both work entirely offline, offer native options and repeatable seeds, and join the verified seven-bundle installation. The README gallery now runs from the earliest savers to the newest. Existing preferences are preserved.

          Download the DMG, open it, and double-click each `.saver` to install for the current user. Select the saver in System Settings → Wallpaper → Screen Saver (or Screen Saver on older macOS), then open its options. The ZIP contains the same bundles. Verify downloads with `shasum -a 256 -c SHA256SUMS` from the directory containing both downloads.

          City Drift’s online vector and traditional modes request tiles for the selected public city. Its explicit offline mode uses only bundled maps. Flourish, Lattice, Dapple, Paper Sky, Voxel Cosmos and World Clock Room make no network requests. No location access, analytics or telemetry. Map data © OpenStreetMap contributors.

          NOTES
          cat dist/SIGNING.txt >> build/release-notes.md
          printf '\nSee the README for Gatekeeper approval and troubleshooting.\n' >> build/release-notes.md
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Screensavers for Mac $tag" --notes-file build/release-notes.md
          else
            gh release create "$tag" --verify-tag --draft --title "Screensavers for Mac $tag" --notes-file build/release-notes.md
          fi
          gh release upload "$tag" dist/*.dmg dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$tag" --draft=false
      - name: Remove signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/screensavers-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/screensavers-certificate.p12"
