name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    permissions:
      contents: read
      security-events: write # Upload CodeQL analysis; no release-write access.
    uses: ./.github/workflows/security.yml
  package:
    needs: security
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag and toolchain
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Build and test
        run: |
          make build
          ./Scripts/test.sh
      - name: Import optional Developer ID identity
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./Scripts/import-signing.sh
      - name: Sign and package
        env:
          SKIP_BUILD: '1'
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          ./Scripts/package.sh
          ./Scripts/verify-package.sh
      - name: Prepare release notes
        run: |
          python3 - <<'PYNOTES'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          section = Path('CHANGELOG.md').read_text().split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          notes = f'Screensavers for Mac {version} · Apple Silicon · macOS 14.6+\n\n{section}\n\n'
          notes += 'Download the DMG or ZIP below. Both contain the same nine savers and separate optional AI helper. Verify downloads with `shasum -a 256 -c SHA256SUMS`.\n\n'
          notes += Path('dist/SIGNING.txt').read_text()
          notes += '\nSee the [README](https://github.com/someone-in-texas/screensavers-for-mac#readme) for installation and Gatekeeper approval.\n'
          Path('dist/release-notes.md').write_text(notes)
          PYNOTES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/screensavers-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/screensavers-certificate.p12"
  publish:
    needs: [security, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Only the publisher may create a GitHub release.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: dist
      - name: Verify transferred assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Never replace assets that users may already have downloaded.
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release edit "$tag" --title "Screensavers for Mac $tag" --notes-file release-notes.md
          else
            gh release create "$tag" --verify-tag --draft --title "Screensavers for Mac $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" ./*.dmg ./*.zip SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
