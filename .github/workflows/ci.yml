name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    permissions:
      contents: read
      security-events: write # Upload CodeQL analysis; no release-write access.
    uses: ./.github/workflows/security.yml
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Build, test and verify packages
        run: make release-check
      - name: Smoke renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-smoke-renders
          path: build/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
